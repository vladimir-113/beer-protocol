<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BEER PROTOCOL TMA</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@300;500&display=swap');

        :root {
            --neon-amber: #ff9d00;
            --neon-red: #ff3131;
            --bg-dark: #0a0a0c;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; /* Убираем синий блик при нажатии на мобилках */
        }

        body, html {
            margin: 0;
            padding: 0;
            background: var(--bg-dark);
            color: #fff;
            font-family: 'Roboto Mono', monospace;
            height: 100vh;
            width: 100vw;
            overflow: hidden; /* Запрещаем скролл для эффекта приложения */
        }

        /* Эффект старого монитора (облегчен для мобилок) */
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 3px;
            z-index: 10;
            pointer-events: none;
        }

        /* Заглушка 21+ */
        #age-gate {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: 0.5s;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between; /* Растягиваем контент */
            height: 100vh;
            padding: 40px 20px;
            background: radial-gradient(circle at center, #1a1a1e 0%, #050505 100%);
            opacity: 0;
            transition: 0.5s ease-out;
        }

        .active-site .container { opacity: 1; }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem; /* Уменьшили для мобилок */
            text-align: center;
            color: var(--neon-amber);
            text-shadow: 0 0 15px rgba(255, 157, 0, 0.5);
            margin: 0;
            letter-spacing: 3px;
        }

        .machine {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            flex-grow: 0;
            margin: 20px 0;
        }

        .screen {
            background: #000;
            border: 1px solid var(--neon-amber);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            margin-bottom: 25px;
            box-shadow: inset 0 0 15px rgba(255, 157, 0, 0.2);
        }

        #reason-text {
            font-size: 1rem;
            color: #00ffcc;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.4;
        }

        .lever-btn {
            background: transparent;
            border: 2px solid var(--neon-red);
            color: var(--neon-red);
            padding: 18px 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%; /* Кнопка на всю ширину */
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(255, 49, 49, 0.2);
        }

        .lever-btn:active {
            background: var(--neon-red);
            color: #000;
        }

        .warning-strip {
            width: 100%;
            padding: 10px;
            font-size: 0.6rem;
            text-align: center;
            color: var(--neon-red);
            border-top: 1px solid rgba(255, 49, 49, 0.3);
            text-transform: uppercase;
            opacity: 0.8;
        }
    </style>
</head>
<body>

<div id="age-gate">
    <h2 style="font-family: 'Orbitron'; color: var(--neon-red);">ACCESS RESTRICTED</h2>
    <p style="font-size: 0.8rem; margin-bottom: 30px;">ПОДТВЕРДИТЕ СТАТУС: 21+ ЛЕТ</p>
    <button class="lever-btn" onclick="initProtocol()">ИНИЦИИРОВАТЬ ВХОД</button>
</div>

<div class="container" id="app">
    <h1>BEER PROTOCOL</h1>
    
    <div class="machine">
        <div class="screen">
            <div id="reason-text">СИСТЕМА ГОТОВА...</div>
        </div>
        
        <button class="lever-btn" onclick="generateReason()">ВЫБРАТЬ ПОВОД</button>
    </div>

    <div class="warning-strip">
        21+ | ЧРЕЗМЕРНОЕ УПОТРЕБЛЕНИЕ ВРЕДИТ ВАШЕМУ КОДУ
    </div>
</div>

<script>
    // Инициализация Telegram Mini App
    const tg = window.Telegram.WebApp;
    tg.expand(); // Расширяем на весь экран
    tg.headerColor = '#0a0a0c'; // Цвет шапки

    const reasons = [
        "Твоя печень слишком расслабилась на этой неделе.",
        "Пятница — это единственный законный повод не отвечать в Slack.",
        "Уровень хмеля в крови упал до критической отметки.",
        "Нужно синхронизироваться с друзьями в баре.",
        "Ты прошел 5-дневный уровень сложности 'Работа'.",
        "Пиво — это жидкий хлеб, а ты еще не завтракал.",
        "Кто-то в мире сейчас пьет за твое здоровье.",
        "Твой психолог разрешил (мы спросили).",
        "Для калибровки зрения после 8 часов монитора.",
        "Потому что холодный бокал — это лучший антидепрессант.",
        "Сегодня день, заканчивающийся на букву 'а'. Пятница.",
        "Твоему внутреннему викингу нужна Вальгалла."
    ];

    function initProtocol() {
        // Виброотклик Telegram
        tg.HapticFeedback.impactOccurred('medium');
        
        document.getElementById('age-gate').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('age-gate').style.display = 'none';
            document.body.classList.add('active-site');
        }, 500);
    }

    function generateReason() {
        tg.HapticFeedback.selectionChanged(); // Легкая вибрация при клике
        
        const textElement = document.getElementById('reason-text');
        const randomReason = reasons[Math.floor(Math.random() * reasons.length)];
        
        let iterations = 0;
        const interval = setInterval(() => {
            textElement.innerText = randomReason.split("")
                .map((letter, index) => {
                    if(index < iterations) return randomReason[index];
                    return String.fromCharCode(65 + Math.floor(Math.random() * 26));
                })
                .join("");
            
            if(iterations >= randomReason.length) clearInterval(interval);
            iterations += 1; // Ускорили анимацию для мобилок
        }, 30);
    }
</script>

</body>
</html>
